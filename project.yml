name: MobileDevCleaner
options:
  bundleIdPrefix: com.mogiteam
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
targets:
  MobileDevCleaner:
    type: application
    platform: macOS
    sources:
      - MobileDevCleaner
    entitlements:
      path: MobileDevCleaner/MobileDevCleaner.entitlements
      properties:
        com.apple.security.app-sandbox: false
    info:
      path: MobileDevCleaner/Info.plist
      properties:
        CFBundleDisplayName: Mobile Dev Cleaner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en, ja, zh-Hans, pt-BR, de]
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © 2026 Leo Mogiano. MIT License.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mogiteam.mdc
        PRODUCT_NAME: MobileDevCleaner
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  MobileDevCleanerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MobileDevCleanerTests
    dependencies:
      - target: MobileDevCleaner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mogiteam.mdc.MobileDevCleanerTests
schemes:
  MobileDevCleaner:
    build:
      targets:
        MobileDevCleaner: all
    test:
      targets:
        - MobileDevCleanerTests
      # Tests assert Spanish copy; pin the language so the user's in-app choice can't leak in.
      commandLineArguments:
        "-appLanguage es": true
        "-AppleLanguages (es)": true
